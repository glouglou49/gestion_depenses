# Images de base officielles Home Assistant par architecture
# Ces images incluent bashio, contenv, s6-overlay et toutes les dépendances HA.
# Référence : https://github.com/home-assistant/docker-base

build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-nodejs:20
  amd64: ghcr.io/home-assistant/amd64-base-nodejs:20
  armhf: ghcr.io/home-assistant/armhf-base-nodejs:20
  armv7: ghcr.io/home-assistant/armv7-base-nodejs:20
  i386: ghcr.io/home-assistant/i386-base-nodejs:20

# Label OCI pour les métadonnées de l'image
labels:
  io.hass.type: addon
