name: "Gestion Dépense"
version: "1.0.8"
slug: "gestion_depense"
description: "Suivi des dépenses du compte commun avec remontée d'entités dans Home Assistant via MQTT Discovery."
url: "https://github.com/glouglou49/gestion_depenses"

# Architectures supportées
arch:
  - aarch64
  - amd64

# Images de base HA officielles avec Node.js 20 (remplace build.yaml déprécié)
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-nodejs:20
  amd64: ghcr.io/home-assistant/amd64-base-nodejs:20

# Accès réseau et ingress
ingress: true
ingress_port: 80
panel_icon: mdi:cash-register
panel_title: "Gestion Dépense"

# Permissions
hassio_api: true
auth_api: false

# Services requis
services:
  - mqtt:need

# Options configurables via l'onglet "Configuration" de l'add-on dans HA
# Laisser mqtt_host vide = utiliser les variables injectées automatiquement
# par HA via le service mqtt:need (Mosquitto broker local)
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""

schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
